stages:
  - test
  - generate
  - release

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  JULIA_DEPOT_PATH: "$CI_PROJECT_DIR/.julia"

cache:
  key:
    files:
      - Manifest.toml
    prefix: julia
  paths:
    - .julia/
  when: always

sast:
  stage: test

secret_detection:
  stage: test

generate:
  stage: generate
  image: julia:1.12.6
  needs: []
  before_script:
    - rm -f release.env
    - julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
  script:
    - julia --project=. src/main.jl
  artifacts:
    name: "nbn-report"
    when: always
    paths:
      - outputs/output1.png
    reports:
      dotenv: release.env

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  needs:
    - job: generate
      artifacts: true
  script:
    - |
      if [ -z "$RELEASE_TAG" ]; then echo "No new release"; exit 0; fi
      glab release create "$RELEASE_TAG" \
        --name "$RELEASE_VERSION" \
        --assets-links "[{\"name\":\"Dashboard\",\"url\":\"${CI_PROJECT_URL}/-/jobs/${GE_JOB_ID}/artifacts/file/outputs/output1.png\"}]"
